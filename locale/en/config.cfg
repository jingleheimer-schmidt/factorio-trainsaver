
[mod-name]
trainsaver=trainsaver

[mod-description]
trainsaver=A dynamic screensaver that follows trains as they drive around. \nUse __CONTROL_STYLE_BEGIN__Control + T__CONTROL_STYLE_END__ to toggle on/off, and __CONTROL_STYLE_BEGIN__Right__CONTROL_STYLE_END__ / __CONTROL_STYLE_BEGIN__Left__CONTROL_STYLE_END__ to change targets. See mod settings for configuration options.

[mod-setting-name]
ts-transition-speed=Transition speed (km/h)
ts-transition-time=Transition time (seconds)
ts-wait-at-signal=Signal minimum (seconds)
ts-station-minimum=Station minimum (seconds)
ts-driving-minimum=Driving minimum (minutes)
ts-zoom=Zoom
ts-variable-zoom=Variable zoom
ts-time-wait=Inactivity timeout (minutes)
ts-afk-auto-start=AFK AutoStart (minutes)
ts-autostart-while-viewing-map=AutoStart while map is open
ts-autostart-while-gui-is-open=AutoStart while GUI is open
ts-menu-hotkey=Escape with menu
ts-linked-game-control-hotkey=Escape with game controls
ts-notable-events=Print notable events
ts-secrets=Enable scope creep

[mod-setting-description]
ts-transition-speed=Camera movement speed (km/h) while transitioning between targets. \n[color=blue]Default is:[/color] [color=orange]0[/color] (instant transitions) \nSuggested values based on train max speeds: \n[color=orange]260[/color] for trains with [item=coal] or [item=wood] fuel \n[color=orange]270[/color] for trains with [item=solid-fuel] fuel \n[color=orange]300[/color] for trains with [item=rocket-fuel] or [item=nuclear-fuel] fuel
ts-transition-time=Camera transition time (seconds) from one target to the next. \n[color=blue]Default is[/color] [color=orange]0[/color] (instant transitions) \nNote: trainsaver will default to using Transition Speed instead of Transition Time when Transition Speed is greater than 0.
ts-wait-at-signal=Minimum time (seconds) the camera remains on a train stopped at a signal. \n[color=blue]Default is:[/color] [color=orange]30[/color]
ts-station-minimum=Minimum time (seconds) the camera remains on a train stopped at a station, or on an idle spidertron. \n[color=blue]Default is:[/color] [color=orange]5[/color]
ts-driving-minimum=Minimum time (minutes) the camera remains on a moving train or spidertron. \n[color=blue]Default is:[/color] [color=orange]10[/color]
ts-zoom=Target camera zoom level during trainsaver. Lower values zoom out further. Default game zoom is [color=orange]1.5[/color]. \n[color=blue]Default:[/color] [color=orange]0.375[/color]
ts-variable-zoom=When enabled, the camera's zoom will vary by up to [color=orange]±20%[/color].
ts-time-wait=Ends trainsaver after viewing one target for this many minutes without switching to another target. \n[color=blue]Default is:[/color] [color=orange]60[/color]
ts-afk-auto-start=Minimum time (minutes) before trainsaver starts automatically when the player is AFK. 0 to never start automatically. \n[color=blue]Default is:[/color] [color=orange]5[/color]
ts-autostart-while-viewing-map=Allows trainsaver to start automatically while the player is in remote view.
ts-autostart-while-gui-is-open=Allows trainsaver to start automatically while a menu, inventory, or other GUI is open.
ts-menu-hotkey=Exit trainsaver when the game menu is opened (__CONTROL__toggle-menu__).
ts-linked-game-control-hotkey=Exit trainsaver when a game control key is pressed (movement (__CONTROL_STYLE_BEGIN____CONTROL_MOVE____CONTROL_STYLE_END__), inventory (__CONTROL__open-character-gui__), logistic network (__CONTROL__logistic-networks__), etc.).
ts-notable-events=Prints a message in chat when certain special events occur.
ts-secrets=Spider?? I hardly know her! \nExpands trainsaver's focus to spidertrons and rocket launches /|(◦.◦)/|\

