[ts-command-help]
trainsaver=- Toggles trainsaver, a dynamic screensaver that follows active trains
ts-start=- Starts trainsaver; puts the player into dynamic screensaver mode
ts-end=- Ends trainsaver; immediately returns camera control to the player
ts-verbose=- Toggles trainsaver console debug messages
ts-reset_history=- Clears the trainsaver target history
ts-ignore_stations=<train-stop...> - Ignores trains traveling to stations with the specified names. Add train stations using __CONTROL__place-in-chat__.
ts-unignore_stations=<train-stop...> - Stops ignoring train stations with the specified names. Add train stations using __CONTROL__place-in-chat__.
ts-list_ignored_stations=- Lists all ignored train station names
ts-next_target=- Moves forward through target history and selects a new target when already at the newest entry
ts-previous_target=- Focuses trainsaver on the previous target in history

[ts-messages]
station-ignored=[color=orange]trainsaver:[/color] __1__ added train station name "__2__" to the ignore list.
station-already-ignored=[color=orange]trainsaver:[/color] Train station name "__1__" is already on the ignore list.
station-unignored=[color=orange]trainsaver:[/color] __1__ removed train station name "__2__" from the ignore list.
station-not-ignored=[color=orange]trainsaver:[/color] Train station name "__1__" is not on the ignore list.
ignored-stations-list=[color=orange]trainsaver:[/color] Ignored train station names:\n- __1__
no-ignored-stations=[color=orange]trainsaver:[/color] There are no train station names on the ignore list.
failed-to-parse-station=[color=orange]trainsaver:[/color] Failed to parse station names from input: "__1__".
ts-ignore_stations-help=Use __CONTROL__place-in-chat__ on train stations to add them to the /ts-ignore_stations command. \nExample: [color=orange]/ts-ignore_stations [train-stop=__1__] [train-stop=__2__][/color]
ts-unignore_stations-help=Use __CONTROL__place-in-chat__ on train stations to add them to the /ts-unignore_stations command. \nExample: [color=orange]/ts-unignore_stations [train-stop=__1__] [train-stop=__2__][/color]

