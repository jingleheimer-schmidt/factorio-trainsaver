[ts-command-help]
trainsaver=- Toggles trainsaver, a dynamic screensaver that follows active trains
ts-start=- Starts trainsaver; puts the player into dynamic screensaver mode
ts-end=- Ends trainsaver; immediately returns camera control to the player
ts-verbose=- Toggles trainsaver console debug messages
ts-reset_history=- Clears the trainsaver history log
ts-ignore_stations=- Trains headed to the specified stations will be ignored as potential targets. Complete the command by adding stations using __CONTROL__place-in-chat__ \nExample: [color=orange]/ts-ignore_stations [train-stop=__1__][/color]
ts-unignore_stations=- Removes stations from the ignore list. Complete the command by adding stations using __CONTROL__place-in-chat__ \nExample: [color=orange]/ts-unignore_stations [train-stop=__1__][/color]
ts-list_ignored_stations=- Lists all stations currently on the ignore list
ts-next_target=- Focuses trainsaver on the next target in history
ts-previous_target=- Focuses trainsaver on the previous target in history

[ts-messages]
station-ignored=[color=orange]trainsaver:[/color] __1__ added stations named [__2__] to the ignore list
station-already-ignored=[color=orange]trainsaver:[/color] Stations named [__1__] are already on the ignore list
station-unignored=[color=orange]trainsaver:[/color] __1__ removed stations named [__2__] from the ignore list
station-not-ignored=[color=orange]trainsaver:[/color] Stations named [__1__] are not on the ignore list
ignored-stations-list=[color=orange]trainsaver:[/color] Ignored stations: \n- __1__
no-ignored-stations=[color=orange]trainsaver:[/color] There are currently no ignored stations
failed-to-parse-station=[color=orange]trainsaver:[/color] Failed to parse station names from input: "__1__"
ts-ignore_stations-help=Use __CONTROL__place-in-chat__ on train stations to add them to the /ts-ignore_stations command. \nExample: [color=orange]/ts-ignore_stations [train-stop=__1__] [train-stop=__2__][/color]
ts-unignore_stations-help=Use __CONTROL__place-in-chat__ on train stations to add them to the /ts-unignore_stations command. \nExample: [color=orange]/ts-unignore_stations [train-stop=__1__] [train-stop=__2__][/color]

