trainsaver-self-reflection=[color=orange]Заставка поездов:[/color] Ваш персонаж оказался пассажиром поезда, за которым вы следили.
trainsaver-find-a-friend=[color=orange]Заставка поездов:[/color] Другой игрок оказался пассажиром поезда, за которым вы следили.
trainsaver-long-haul=[color=orange]Заставка поездов:[/color] Проследите за поездом, путь которого пролегает 10 000 клеток.
trainsaver-continuous-10-minutes=[color=orange]Заставка поездов:[/color] Заставка непрерывно активна в течение 10 минут.
trainsaver-continuous-30-minutes=[color=orange]Заставка поездов:[/color] Заставка непрерывно активна в течение 30 минут.
trainsaver-continuous-60-minutes=[color=orange]Заставка поездов:[/color] Заставка непрерывно активна в течение 1 часа.
trainsaver-1-hours-total=[color=orange]Заставка поездов:[/color] Заставка в общем активна в течение 1 часа.
trainsaver-2-hours-total=[color=orange]Заставка поездов:[/color] Заставка в общем активна в течение 2 часов.
trainsaver-5-hours-total=[color=orange]Заставка поездов:[/color] Заставка в общем активна в течение 5 часов.
trainsaver-a-spectacular-view=[color=orange]Заставка поездов:[/color] «И взмела стремительно ракета, разлетевшись ослепительным ливнем». - Роберт Грейвз
trainsaver-character-damaged=[color=orange]Заставка поездов:[/color] Получите урон во время просмотра заставки.
trainsaver-damaged-by-followed-train=[color=orange]Заставка поездов:[/color] Попадите под поезд, за которым вы следите.

[ts-command-help]
trainsaver=- Включает/выключает динамическую заставку поездов, которая следует за движущимися поездами.
ts-start=- Запускает заставку поездов; переводит игрока в режим динамической заставки.
ts-end=- Завершает заставку поездов; возвращает управление камерой игроку.
ts-verbose=- Включает/выключает отладочные сообщения консоли от заставки поездов.
ts-reset_history=- Очищает журнал истории заставки поездов.
ts-ignore_stations=Добавляет станции в список игнорирования. Поезда, направляющиеся к указанным станциям, будут игнорироваться как потенциальные цели для выбора их на заставку. Дополните команду, добавив станции используя __CONTROL__place-in-chat__ \nПример: [color=orange]/ts-ignore_stations [train-stop=__1__][/color]
ts-unignore_stations=- Удаляет станции из списка игнорирования. Дополните команду, добавив станции используя __CONTROL__place-in-chat__ \nПример: [color=orange]/ts-unignore_stations [train-stop=__1__][/color]
ts-list_ignored_stations=- Отображает список всех станций, которые находятся в данный момент в списке игнорирования.
ts-next_target=- Переключает заставку поезда на следующую цель из списка доступных поездов.
ts-previous_target=- Переключает заставку поезда на предыдущую цель из списка доступных поездов.

[ts-messages]
station-ignored=[color=orange]Заставка поездов:[/color] __1__ добавил станции под названием [__2__] в список игнорирования.
station-already-ignored=[color=orange]Заставка поездов:[/color] станции с названием [__1__] уже находятся в списке игнорирования.
station-unignored=[color=orange]Заставка поездов:[/color] __1__ удалил станции под названием [__2__] из списка игнорирования.
station-not-ignored=[color=orange]Заставка поездов:[/color] станции с названием [__1__] не находятся в списке игнорирования.
ignored-stations-list=[color=orange]Заставка поездов:[/color] игнорируемые станции: \n- __1__
no-ignored-stations=[color=orange]Заставка поездов:[/color] в настоящее время нет игнорируемых станций.
failed-to-parse-station=[color=orange]Заставка поездов:[/color] не удалось распознать название станций от: "__1__".
ts-ignore_stations-help=Используйте __CONTROL__place-in-chat__ на железнодорожной станции, чтобы добавить её в команду /ts-ignore_stations.\nПример: [color=orange]/ts-ignore_stations [train-stop=__1__] [train-stop=__2__][/color]
ts-unignore_stations-help=Используйте __CONTROL__place-in-chat__ на железнодорожной станции, чтобы добавить её в команду /ts-unignore_stations.\nПример: [color=orange]/ts-unignore_stations [train-stop=__1__] [train-stop=__2__][/color]


