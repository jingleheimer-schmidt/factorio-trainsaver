
[mod-name]
trainsaver=Trainsaver (Заставка поездов)

[mod-description]
trainsaver=Этот мод создает динамическую заставку, которая позволяет наблюдать за движущимися поездами.\nИспользуйте __CONTROL_STYLE_BEGIN__Control + T__CONTROL_STYLE_END__, чтобы включить/выключить и __CONTROL_STYLE_BEGIN__Right__CONTROL_STYLE_END__ / __CONTROL_STYLE_BEGIN__Left__CONTROL_STYLE_END__ для смены цели. См. настройки модов для изменения конфигурации.

[mod-setting-name]
ts-transition-speed=Скорость перехода (км/ч)
ts-transition-time=Время перехода (секунд)
ts-wait-at-signal=Переход при сигнале (секунд)
ts-station-minimum=Переход на станции (секунд)
ts-driving-minimum=Переход когда есть водитель (минут)
ts-zoom=Масштаб
ts-variable-zoom=Регулируемый масштаб
ts-time-wait=Тайм-аут при бездействии поездов (минут)
ts-afk-auto-start=Автозапуск при бездействии игрока (минут)
ts-autostart-while-viewing-map=Автозапуск когда открыта карта
ts-autostart-while-gui-is-open=Автозапуск когда открыт интерфейс
ts-menu-hotkey=Завершение при открытии меню
ts-linked-game-control-hotkey=Завершение при нажатии клавиш
ts-notable-events=Сообщать важные события
ts-secrets=Включить функцию для паукотронов

[mod-setting-description]
ts-transition-speed=Скорость движения камеры при переходе заставки от одного поезда к другому.\n[color=blue]По умолчанию:[/color] [color=orange]0[/color] (мгновенный переход)\nПредлагаемые значения основаны на максимальной скорости поездов: \n[color=orange]259[/color] для поездов где используется [item=coal] или [item=wood] \n[color=orange]272[/color] для поездов где используется [item=solid-fuel] \n[color=orange]298[/color] для поездов где используется [item=rocket-fuel] или [item=nuclear-fuel]
ts-transition-time=Количество секунд, необходимое для перехода заставки от одного поезда к другому. \n[color=blue]По умолчанию[/color] [color=orange]0[/color] (мгновенный переход)\nПримечание: заставка будет по умолчанию использовать Скорость перехода вместо Время перехода, если Скорость перехода больше 0.
ts-wait-at-signal=Минимальное ожидание (секунд), прежде чем заставка переключится на новый поезд, когда текущий поезд останавливается на сигнале. \n[color=blue]По умолчанию:[/color] [color=orange]30[/color]


ts-station-minimum=Минимальное ожидание (секунд), прежде чем заставка переключится на новый поезд, когда текущий поезд останавливается на станции. \n[color=blue]По умолчанию:[/color] [color=orange]5[/color]
ts-driving-minimum=Минимальное ожидание (минут), в течение которого камера остается на движущемся поезде.\n[color=blue]По умолчанию:[/color] [color=orange]10[/color]
ts-zoom=Уровень масштабирования камеры, когда используется заставка. Чем ниже значения, тем меньше масштаб. Стандартный масштаб игры [color=orange]1.5[/color].\n[color=blue]По умолчанию:[/color] [color=orange]0.375[/color]
ts-variable-zoom=Если включено, масштаб камеры может меняться на [color=orange]±20%[/color]
ts-time-wait=Количество минут до завершения заставки, когда нет активных поездов. \n[color=blue]По умолчанию:[/color] [color=orange]15[/color]
ts-afk-auto-start=Минимальное ожидание (минут) до автоматического запуска заставки, когда игрок бездействует. Установка значения на 0, отключает автоматический запуск заставки. \n[color=blue]По умолчанию:[/color] [color=orange]5[/color]
# ts-autostart-while-viewing-map=Определяет, будет ли при бездействии игрока автоматически запускаться заставка, когда у игрока открыта карта
# ts-autostart-while-gui-is-open=Определяет, будет ли при бездействии игрока автоматически запускаться заставка, когда у игрока открыт графический интерфейс
ts-menu-hotkey=Завершает заставку при открытии игрового меню (__CONTROL__toggle-menu__)
ts-linked-game-control-hotkey=Завершает заставку при нажатии клавиши управления игрой (передвижение (__CONTROL_STYLE_BEGIN____CONTROL_MOVE____CONTROL_STYLE_END__), инвентарь (__CONTROL__open-character-gui__), логистическая сеть (__CONTROL__logistic-networks__), и т.д.)
ts-notable-events=Выводит сообщения в чате при появлении определенных событий.
ts-secrets=Паук?? Я даже не знаю!

